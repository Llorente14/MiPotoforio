<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400">
  <!-- Kaito Kid's calling card: the ace of clubs with his doodle (top hat, monocle and grin) in black line. -->
  <defs>
    <symbol id="kc-club" viewBox="-50 -52 100 104">
      <circle cx="0" cy="-24" r="22" />
      <circle cx="-24" cy="8" r="22" />
      <circle cx="24" cy="8" r="22" />
      <path d="M-5 4 C-4 26 -12 40 -24 50 H24 C12 40 4 26 5 4 Z" />
    </symbol>
  </defs>

  <rect width="1000" height="1400" rx="44" fill="#ffffff" />
  <rect x="1.5" y="1.5" width="997" height="1397" rx="43" fill="none" stroke="#d6d3cc" stroke-width="3" />

  <!-- corner indices: serif A over a club, repeated upside down -->
  <g fill="#111111">
    <text x="84" y="152" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="150">A</text>
    <use href="#kc-club" x="44" y="170" width="80" height="84" />
    <g transform="rotate(180 500 700)">
      <text x="84" y="152" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="150">A</text>
      <use href="#kc-club" x="44" y="170" width="80" height="84" />
    </g>
  </g>

  <g fill="none" stroke="#111111" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- top hat: tall crown, band line, wide brim -->
    <path d="M335 768 L335 433 L605 433 L605 766" />
    <path d="M335 694 L605 694" />
    <path d="M190 772 Q470 780 742 758" />
    <!-- monocle cord hanging from the brim to a small weight -->
    <path d="M214 776 L214 928" stroke-width="10" />
    <!-- monocle -->
    <circle cx="560" cy="878" r="84" />
  </g>
  <path d="M188 970 L214 922 L240 970 Z" fill="#111111" />
  <!-- the eye behind the monocle: a dark wedge under the brim -->
  <path d="M570 812 L692 796 L688 822 Q642 846 606 848 Z" fill="#111111" />
  <!-- the grin, drawn over the monocle -->
  <path d="M340 888 Q520 884 676 840 Q650 962 486 972 Q384 970 340 888 Z" fill="#ffffff" stroke="#111111" stroke-width="16" stroke-linejoin="round" />
  <path d="M398 900 L410 960 M452 898 L456 970 M506 892 L506 972 M560 884 L556 966 M612 870 L602 950" stroke="#111111" stroke-width="10" stroke-linecap="round" />
</svg>
