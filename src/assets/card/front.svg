<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400">
  <!-- Kaito Kid's calling card: the ace of clubs with his mark in the middle. -->
  <defs>
    <symbol id="kc-club" viewBox="-50 -52 100 104">
      <circle cx="0" cy="-24" r="22" />
      <circle cx="-24" cy="8" r="22" />
      <circle cx="24" cy="8" r="22" />
      <path d="M-5 4 C-4 26 -12 40 -24 50 H24 C12 40 4 26 5 4 Z" />
    </symbol>
  </defs>

  <rect width="1000" height="1400" rx="44" fill="#ffffff" />
  <rect x="1.5" y="1.5" width="997" height="1397" rx="43" fill="none" stroke="#d6d3cc" stroke-width="3" />

  <!-- corner indices: serif A over a club, repeated upside down -->
  <g fill="#111111">
    <text x="84" y="152" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="150">A</text>
    <use href="#kc-club" x="44" y="170" width="80" height="84" />
    <g transform="rotate(180 500 700)">
      <text x="84" y="152" text-anchor="middle" font-family="Times New Roman, Times, serif" font-size="150">A</text>
      <use href="#kc-club" x="44" y="170" width="80" height="84" />
    </g>
  </g>

  <!-- Kid's mark: Axel's own artwork (public/brand/kaito-card.webp, 640 px), centred on the card. -->
  <image href="/brand/kaito-card.webp" x="110" y="320" width="780" height="780" />
</svg>
