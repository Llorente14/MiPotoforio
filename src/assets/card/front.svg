<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400">
  <!-- Kaito Kid's calling card: plain white stock with his doodle in black line. -->
  <rect width="1000" height="1400" rx="48" fill="#fbfaf6" />
  <rect x="1.5" y="1.5" width="997" height="1397" rx="47" fill="none" stroke="#d9d5cb" stroke-width="3" />

  <g fill="none" stroke="#141210" stroke-linecap="round" stroke-linejoin="round" transform="translate(500 700)">
    <!-- top hat, tilted a touch to the right -->
    <g transform="rotate(6)">
      <path d="M-128 -150 L-118 -372 Q0 -392 118 -372 L128 -150" stroke-width="16" />
      <path d="M-118 -372 Q0 -352 118 -372" stroke-width="10" />
      <path d="M-127 -196 Q0 -176 127 -196 L128 -150 Q0 -130 -128 -150 Z" fill="#141210" stroke-width="10" />
      <path d="M-250 -140 Q-210 -112 0 -108 Q210 -112 250 -140 Q262 -150 246 -160 Q200 -172 128 -160 M-128 -160 Q-200 -172 -246 -160 Q-262 -150 -250 -140" stroke-width="16" />
    </g>
    <!-- left eye: a sly arc -->
    <path d="M-150 -18 Q-108 -52 -62 -20" stroke-width="18" />
    <!-- monocle over the right eye, cord swinging down to a clover -->
    <circle cx="104" cy="-12" r="74" stroke-width="18" />
    <path d="M90 -14 Q106 -30 124 -12" stroke-width="12" />
    <path d="M168 26 Q236 120 182 214" stroke-width="7" />
    <g fill="#141210" stroke="none" transform="translate(178 236)">
      <circle cx="0" cy="-15" r="14" /><circle cx="-14" cy="5" r="14" /><circle cx="14" cy="5" r="14" />
      <path d="M-3 4 L-6 30 L6 30 L3 4 Z" />
    </g>
    <!-- the grin -->
    <path d="M-196 82 Q-20 126 196 70 Q140 252 -10 258 Q-150 252 -196 82 Z" fill="#fbfaf6" stroke-width="18" />
    <path d="M-182 112 Q0 150 186 102" stroke-width="7" />
    <path d="M-120 108 L-110 222 M-60 120 L-56 248 M0 126 L0 256 M60 120 L56 248 M120 106 L110 226" stroke-width="7" />
  </g>
</svg>
