<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240">
  <!-- Face decal for blender/akai.py. 1 unit = 1 mm. x = 1000 * (model x + 0.13); y = 1000 * (1.32 - model z). -->
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#173a2a" />
      <stop offset="0.6" stop-color="#2f7a52" />
      <stop offset="1" stop-color="#6fb88a" />
    </linearGradient>
    <g id="eye">
      <!-- narrow, sharp eye: a sniper squint -->
      <path d="M-18 1 Q-8 -7 4 -7 Q14 -6 19 -1 Q10 6 0 6 Q-10 6 -18 1 Z" fill="#ffffff" />
      <ellipse cx="2" cy="0" rx="6.5" ry="6" fill="url(#iris)" />
      <ellipse cx="2" cy="0.5" rx="2.6" ry="3.6" fill="#0d1a12" />
      <circle cx="-0.5" cy="-2.5" r="1.6" fill="#ffffff" />
      <path d="M-20 1 Q-9 -10 5 -9.5 Q16 -8.5 22 -1 L18 0 Q12 -6 4 -6 Q-8 -6 -16 3 Z" fill="#111" />
      <!-- the dark circles under his eyes -->
      <path d="M-14 9 Q0 14 15 7" fill="none" stroke="#7a5a52" stroke-width="1.6" stroke-linecap="round" />
      <path d="M-11 12.5 Q0 16 12 11" fill="none" stroke="#7a5a52" stroke-width="1.1" stroke-linecap="round" opacity="0.7" />
    </g>
  </defs>

  <use href="#eye" transform="translate(60 115) scale(-1 1)" />
  <use href="#eye" transform="translate(140 115)" />

  <!-- low, straight brows -->
  <path d="M38 98 L82 101 L81 105 L39 103 Z" fill="#141414" />
  <path d="M118 101 L162 98 L161 103 L119 105 Z" fill="#141414" />

  <path d="M102 134 L106 150 L100 152" fill="none" stroke="#a6795f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- a flat, set mouth -->
  <path d="M86 178 Q100 180 114 177" fill="none" stroke="#4d2c25" stroke-width="2.4" stroke-linecap="round" />
</svg>
